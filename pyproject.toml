[project]
name = "hammock"
version = "0.1.0"
description = "Run your whole local stack with one command; a local LLM tells you which service an error really started in."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# The local model is optional: without it Hammock still detects, correlates and shows the
# incident card, and `hammock prompt` hands the context to any model you like.
llm = ["ollama>=0.4"]

[project.scripts]
hammock = "hammock.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
